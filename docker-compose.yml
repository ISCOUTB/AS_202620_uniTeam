services:
  db:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatoria}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE es obligatoria}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER es obligatoria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD es obligatoria}
      MYSQL_TCP_PORT: ${DB_PORT:-3306}
    expose:
      - "${DB_PORT:-3306}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P $${MYSQL_TCP_PORT:-3306} -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - datos_mysql:/var/lib/mysql

  migrate:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "migrate.py"]

  api:
    build:
      context: .
      target: api
    environment:
      PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      CREAR_ESQUEMA: "0"
      ENTORNO: ${ENTORNO:-produccion}
      NIVEL_LOG: ${NIVEL_LOG:-INFO}
      REVISION: ${REVISION:-local}
      OIDC_EMISOR: ${OIDC_EMISOR:?OIDC_EMISOR es obligatoria}
      OIDC_AUDIENCIA: ${OIDC_AUDIENCIA:?OIDC_AUDIENCIA es obligatoria}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLAIM_USUARIO: ${OIDC_CLAIM_USUARIO:-email}
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:?ORIGENES_PERMITIDOS es obligatoria}
      AUTH_DISABLED: ${AUTH_DISABLED:-0}
      DEMO_USER: ${DEMO_USER:-profesor@uniteam.local}
    expose:
      - "${API_PORT:-8000}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL es obligatoria}
        NEXT_PUBLIC_OIDC_EMISOR: ${NEXT_PUBLIC_OIDC_EMISOR:?NEXT_PUBLIC_OIDC_EMISOR es obligatoria}
        NEXT_PUBLIC_OIDC_CLIENTE: ${NEXT_PUBLIC_OIDC_CLIENTE:?NEXT_PUBLIC_OIDC_CLIENTE es obligatoria}
        NEXT_PUBLIC_OIDC_AUDIENCIA: ${NEXT_PUBLIC_OIDC_AUDIENCIA:?NEXT_PUBLIC_OIDC_AUDIENCIA es obligatoria}
        NEXT_PUBLIC_OIDC_CLAIM_USUARIO: ${NEXT_PUBLIC_OIDC_CLAIM_USUARIO:-email}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-0}
    environment:
      PORT: ${WEB_PORT:-3000}
    expose:
      - "${WEB_PORT:-3000}"
    depends_on:
      api:
        condition: service_started

volumes:
  datos_mysql:
