# Análisis estático en SonarCloud (organización isco-utb).
# Lo invoca el trabajo «sonarcloud» de .github/workflows/ci.yml, que espera al
# Quality Gate y falla si no pasa.
# Panel público: https://sonarcloud.io/summary/overall?id=ISCOUTB_AS_202620_uniTeam

sonar.organization=isco-utb
sonar.projectKey=ISCOUTB_AS_202620_uniTeam
sonar.projectName=UniTeam

sonar.sources=app,web/app,web/lib,scripts
sonar.tests=test
sonar.exclusions=web/out/**,web/.next/**,web/node_modules/**,**/__pycache__/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Cobertura: se mide la API, que es donde están las pruebas. El frontend no
# tiene pruebas unitarias y los scripts son herramientas de desarrollo; se
# analizan igual en busca de defectos y vulnerabilidades, pero no se les exige
# cobertura. Es una deuda declarada, no un olvido: docs/calidad/analisis-estatico.md
sonar.coverage.exclusions=web/**,scripts/**
