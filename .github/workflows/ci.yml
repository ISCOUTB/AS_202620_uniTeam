name: CI

on:
  push:
  pull_request:

# Si llega un push nuevo a la misma rama, el run anterior ya no decide nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas contra MySQL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Sin credenciales en el repositorio: la contraseña se genera en cada
      # ejecución, se enmascara en el registro y desaparece con el corredor.
      # La de root ni siquiera se conoce. Arranca antes de instalar
      # dependencias para que MySQL se inicialice mientras tanto.
      - name: Arrancar MySQL con una contraseña de un solo uso
        run: |
          clave="$(openssl rand -hex 24)"
          echo "::add-mask::$clave"
          docker run --detach --name mysql --publish 127.0.0.1:3306:3306 \
            --env MYSQL_RANDOM_ROOT_PASSWORD=yes \
            --env MYSQL_DATABASE=uniteam_test \
            --env MYSQL_USER=uniteam \
            --env "MYSQL_PASSWORD=$clave" \
            mysql:8.4
          {
            echo "CLAVE_MYSQL=$clave"
            echo "DATABASE_URL=mysql+pymysql://uniteam:$clave@127.0.0.1:3306/uniteam_test"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: "pip install --require-hashes --only-binary :all: -r requirements.lock.txt"

      # Por TCP y con el usuario de las pruebas: durante la inicialización
      # MySQL arranca un servidor temporal sin red, así que responder aquí
      # significa que el definitivo ya acepta conexiones.
      - name: Esperar a que MySQL acepte conexiones
        run: |
          for _ in $(seq 60); do
            if docker exec --env "MYSQL_PWD=$CLAVE_MYSQL" mysql \
                mysql --host=127.0.0.1 --user=uniteam --execute="SELECT 1" uniteam_test \
                >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL no aceptó conexiones en 120 s."
          docker logs mysql
          exit 1

      # Determinista: compara lo que fija el repositorio consigo mismo, sin
      # volver a resolver contra PyPI. El cierre completo ya lo validó pip
      # al instalar, que en modo --require-hashes rechaza cualquier
      # dependencia sin fijar.
      - name: Comprobar el cierre de dependencias
        run: |
          python scripts/verificar_cierre.py
          pip check

      - name: Verificar los enlaces de la documentación
        run: python scripts/verificar_enlaces.py

      - name: Verificar el contrato OpenAPI
        run: python scripts/verificar_contrato.py

      - name: Ejecutar las pruebas de contrato
        run: pytest -v test/test_contrato.py --cov=app --cov-report=

      - name: Ejecutar las pruebas de integración y de operación
        run: >-
          pytest -v
          test/test_corte_vertical.py test/test_tablero.py test/test_proyectos.py
          test/test_autenticacion.py test/test_operacion.py
          test/test_edicion_tareas.py test/test_robustez.py test/test_flujo_estados.py
          test/test_vistas.py test/test_scripts.py
          --cov=app --cov-append --cov-report=xml --cov-report=term

      - name: Guardar el informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Compilación del frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Compilar y comprobar tipos
        working-directory: web
        run: npm run build

  imagenes:
    name: Construcción de las imágenes
    runs-on: ubuntu-latest

    # Las mismas imágenes que ejecuta el despliegue (render.yaml): si no
    # construyen aquí, no se despliegan allí.
    steps:
      - uses: actions/checkout@v4

      - name: Imagen de la API
        run: docker build --target api -t uniteam-api .

      - name: La imagen de la API no incluye el emisor de desarrollo
        run: |
          if docker run --rm --entrypoint ls uniteam-api scripts/emisor_dev.py 2>/dev/null; then
            echo "::error::La imagen de producción contiene el emisor OIDC de desarrollo."
            exit 1
          fi

      - name: Imagen de la Aplicación Web
        run: docker build -t uniteam-web web

  sonarcloud:
    name: Análisis estático (SonarCloud)
    runs-on: ubuntu-latest
    needs: pruebas

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar necesita el historial para atribuir el código nuevo.
          fetch-depth: 0

      - name: Recuperar el informe de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura

      - name: Exigir el secreto SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::Falta el secreto SONAR_TOKEN; no se puede omitir el análisis estático requerido. Ver docs/despliegue/guia.md."
          exit 1

      # qualitygate.wait hace que el trabajo falle si el Quality Gate falla,
      # así que un Quality Gate rojo bloquea la integración igual que una
      # prueba roja.
      - name: Analizar y esperar el Quality Gate
        if: env.SONAR_TOKEN != ''
        # Fijada por SHA: una etiqueta se puede mover, un commit no. La v5
        # anterior ya no tiene soporte y su propio código avisa de una
        # vulnerabilidad.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
