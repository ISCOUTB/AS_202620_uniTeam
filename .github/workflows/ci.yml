name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Pruebas contra MySQL
    runs-on: ubuntu-latest

    services:
      # Credenciales de un servicio efimero del corredor, no de un despliegue:
      # docs/calidad/analisis-estatico.md las justifica.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: uniteam
          MYSQL_DATABASE: uniteam_test
          MYSQL_USER: uniteam
          MYSQL_PASSWORD: uniteam
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuniteam -puniteam"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: "pip install --require-hashes --only-binary :all: -r requirements.lock.txt"

      - name: Verificar los enlaces de la documentación
        run: python scripts/verificar_enlaces.py

      - name: Verificar el contrato OpenAPI
        run: |
          pip install pyyaml
          python -c "
          import yaml, sys
          with open('docs/api/openapi.yaml') as f:
              spec = yaml.safe_load(f)
          required_paths = ['/proyectos', '/proyectos/{proyecto_id}', '/proyectos/{proyecto_id}/tareas', '/proyectos/{proyecto_id}/tareas/{tarea_id}', '/proyectos/{proyecto_id}/progreso']
          for p in required_paths:
              assert p in spec['paths'], f'Ruta faltante en contrato: {p}'
          print('Contrato OpenAPI: completo')
          "
      - name: Ejecutar las pruebas de contrato
        env:
          DATABASE_URL: mysql+pymysql://uniteam:uniteam@127.0.0.1:3306/uniteam_test
        run: pytest -v test/test_contrato.py
      - name: Ejecutar las pruebas de integración
        env:
          DATABASE_URL: mysql+pymysql://uniteam:uniteam@127.0.0.1:3306/uniteam_test
        run: pytest -v test/test_corte_vertical.py test/test_tablero.py test/test_proyectos.py test/test_autenticacion.py

  frontend:
    name: Compilación del frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Compilar y comprobar tipos
        working-directory: web
        run: npm run build

  cierre:
    name: Cierre de dependencias al día
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # La misma versión que la imagen de la API: una resolución hecha con
          # otra versión de Python produce un árbol distinto.
          python-version: "3.11"

      - name: Recompilar el cierre y compararlo con el del repositorio
        run: |
          pip install pip-tools
          pip-compile --generate-hashes --strip-extras --no-header --quiet \
            --output-file=esperado.txt requirements.txt
          # Se comparan solo las líneas de paquete: la cabecera de
          # requirements.lock.txt explica cómo regenerarlo y pip-compile no la
          # produce.
          grep -v '^#' requirements.lock.txt > cierre-actual.txt
          grep -v '^#' esperado.txt > cierre-esperado.txt
          diff -u cierre-actual.txt cierre-esperado.txt || {
            echo '::error file=requirements.lock.txt::No corresponde a requirements.txt. Regenéralo con pip-compile --generate-hashes --strip-extras.'
            exit 1
          }

  actualizar-cierre:
    name: Actualizar cierre de dependencias
    needs: cierre
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Instalar pip-tools
        run: pip install pip-tools
      
      - name: Regenerar requirements.lock.txt
        run: |
          pip-compile --generate-hashes --strip-extras --no-header --quiet \
            --output-file=requirements.lock.txt requirements.txt
      
      - name: Commit automático
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar requirements.lock.txt"
          file_pattern: requirements.lock.txt
