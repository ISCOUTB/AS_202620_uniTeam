name: seguridad-dependencias

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  api-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar dependencias de la API
        shell: bash
        run: |
          set -eo pipefail
          pip install --only-binary :all: pip-audit==2.10.1
          # Se audita el cierre con huella (requirements.lock.txt) porque es el árbol
          # exacto que instala la CI y el Dockerfile. Si falta, se cae a requirements.txt.
          # `set -eo pipefail` hace que el job falle si pip-audit reporta hallazgos:
          # `tee` solo conserva el informe, no oculta el código de salida.
          if [ -f requirements.lock.txt ]; then
            pip-audit -r requirements.lock.txt | tee pip-audit.txt
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt | tee pip-audit.txt
          elif [ -f app/requirements.txt ]; then
            pip-audit -r app/requirements.txt | tee pip-audit.txt
          else
            echo "No hay archivo de dependencias para auditar" > pip-audit.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: pip-audit.txt

  web-npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Auditar dependencias de la web
        working-directory: web
        shell: bash
        run: |
          set -eo pipefail
          npm ci --ignore-scripts
          # `set -eo pipefail` hace que el job falle si npm audit reporta hallazgos
          # de nivel alto o crítico; `tee` solo conserva el informe.
          npm audit --omit=dev --audit-level=high | tee ../npm-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: npm-audit.txt
